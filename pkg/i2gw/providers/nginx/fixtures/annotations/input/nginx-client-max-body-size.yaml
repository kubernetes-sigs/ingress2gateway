apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-max-body-size-ingress
  namespace: default
  annotations:
    nginx.org/client-max-body-size: "32m"
spec:
  ingressClassName: nginx
  rules:
    - host: client-max-body-size.example.com
      http:
        paths:
          - path: /helloworld.Greeter/SayHello
            pathType: Prefix
            backend:
              service:
                name: client-max-body-size-svc
                port:
                  number: 8080
