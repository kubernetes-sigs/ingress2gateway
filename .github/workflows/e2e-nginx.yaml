name: e2e-nginx
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-nginx:
    # Runs only the NGINX e2e tests: the nginx provider (NGINX Ingress Controller), the nginx emitter
    # and NGINX Gateway Fabric, plus the nginx entries of the shared provider, implementation and
    # multi-provider tables. The full suite runs upstream on Prow (pull-ingress2gateway-e2e).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Same kind version `make e2e` installs when kind is missing, matching the Prow job (its
      # default node image is Kubernetes 1.31). The runner image ships a newer kind, which would
      # otherwise be picked up from PATH.
      KIND_VERSION: v0.25.0
      # `$` is Make-escaped as `$$` (see e2e/README.md).
      I2GW_GO_TEST_ARGS: >-
        -race -v -count=1 -timeout=40m
        -run '^TestNginx.*$$|^(TestProviders|TestImplementations|TestMultipleProviders)$$/^(nginx|nginx-gateway-fabric|ingress-nginx_\+_nginx)$$'
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSLo "${RUNNER_TEMP}/bin/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "${RUNNER_TEMP}/bin/kind"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Run NGINX e2e tests
        env:
          # Keep the kind cluster so its logs can be exported if the tests fail. The runner is
          # discarded afterwards anyway.
          SKIP_CLEANUP: "1"
        run: |
          kind version
          make e2e

      - name: Export cluster logs
        if: failure()
        run: kind export logs -n i2gw-e2e "${RUNNER_TEMP}/kind-logs" || true

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs
          path: ${{ runner.temp }}/kind-logs
          retention-days: 7
